<!doctype html>

<html lang="en" data-theme="dark" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />

		<!-- Installability. The manifest sits at the deploy root and states start_url,
		     scope and its icon sources relative to itself, so an operator running under
		     SPOOLMAN_BASE_PATH gets a correctly scoped app without a build-time rebuild.
		     %sveltekit.assets% is relative on the prerendered documents; on the SPA
		     fallback (200.html) it is absolute and gets rewritten server-side — see
		     load_and_rewrite_fallback_base_path in spoolman/client.py. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<meta name="theme-color" content="#1f1f1f" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>Spoolman</title>

		<!-- Resolve the saved color theme before first paint to avoid a flash of the
		     wrong theme. Mirrors lib/stores/theme.svelte.ts. -->
		<script>
			(function () {
				try {
					var p = localStorage.getItem('spoolman-v2-theme') || 'system';
					var t =
						p === 'light' || p === 'dark'
							? p
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', t);
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) m.setAttribute('content', t === 'light' ? '#f2f1ee' : '#1f1f1f');
				} catch (e) {}
			})();
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />

		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
