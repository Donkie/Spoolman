name: Generate sponsors image

on:
  schedule:
    - cron: '0 3 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  sponsorkit:
    runs-on: ubuntu-latest
    steps:
      # Checks out with the PAT rather than the default GITHUB_TOKEN: the commit
      # step below pushes straight to master, and the ruleset there only lets a
      # bypass-capable actor through.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.PAT }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/sponsorkit/package-lock.json

      - name: Install sponsorkit
        working-directory: .github/sponsorkit
        run: npm ci

      - name: Generate sponsors image
        working-directory: .github/sponsorkit
        run: npx sponsorkit
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.PAT }}

      # Only commits when the rendered image actually differs from what is checked in.
      - name: Commit sponsors image
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update sponsors image'
          file_pattern: '.github/media/sponsors.svg .github/media/sponsors.png'
          skip_dirty_check: false
