name: Auto-merge Weblate PRs

# Translations are managed exclusively through Weblate (https://hosted.weblate.org/projects/spoolman/),
# which opens a pull request for every sync back to this repo (see guard-translations.yml). Those PRs
# are machine-generated, always scoped to a locale tree (client_v2/locales/ today), and gated by the
# full CI suite just like any other PR. Rather than hand-merging each one, this workflow turns on GitHub's native
# auto-merge once a week for Weblate-authored PRs so they merge themselves once all required status checks pass.
#
# Why auto-merge instead of giving Weblate direct push access to master:
#   - Every sync still runs through style/tests/build before it can land; nothing merges unvalidated.
#   - No actor gains unrestricted, un-CI'd direct write to master. A compromised Weblate token can only
#     open a PR; auto-merge fires solely on green CI for Weblate-authored PRs.
#   - GitHub write/bypass can't be scoped to locale files, so direct write would grant all-file access.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# contents+pull-requests write let the built-in GITHUB_TOKEN enable auto-merge and perform the merge.
# The token is not a ruleset bypass actor and doesn't need to be: with 0 required approvals it
# satisfies the branch requirements once the required checks go green, exactly like a manual merge.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only ever act on Weblate's own translation-sync PRs. Human PRs are never touched.
    # Scheduled runs use the default-branch workflow. This job never checks out or executes
    # PR code; it only calls the GitHub API to inspect PRs and enable auto-merge or merge them.
    steps:
      # Defence in depth: don't trust the author alone, trust the diff. Even a compromised Weblate
      # token can only ever get auto-merged if the PR is confined to locale JSON files. Anything
      # else (a code file, a workflow, a non-.json file, a file outside the two locale trees)
      # fails the check, auto-merge is never enabled, and the PR waits for a human. The file list is
      # read from the API; this step never checks out or runs PR code.
      #
      # Both locale trees are allowed. client_v2/locales/ is where translations go now; the legacy
      # client/public/locales/ tree stays on the list only so that a sync opened before its Weblate
      # component was locked isn't stranded half-merged. Locking the component, not this allowlist,
      # is what stops new legacy translations (see guard-translations.yml).
      - name: Verify and merge open Weblate PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # Merge commit, NOT squash. This is load-bearing for Weblate, not a style preference.
        #
        # Weblate keeps its own clone of this repo and rebases it onto master to pick up our changes.
        # A squash merge replaces the Weblate commits with one brand-new commit that has a different
        # hash AND, when the PR held more than one commit, a different patch-id than any of them. The
        # rebase therefore can't tell that the work already landed, replays each original commit on top
        # of a master that already contains those very strings, and dies on a content conflict:
        #
        #   Rebasing (1/3)
        #   CONFLICT (content): Merge conflict in client_v2/locales/ru/common.json
        #
        # From then on Weblate can't merge upstream and stops syncing until someone resets it by hand
        # (this happened with PR #1004, which squashed two Russian commits into one). Weblate's own
        # docs are explicit: "Do not squash merge it. Squash merging creates a new commit instead of
        # preserving the Weblate commits, so Weblate might not recognize that its local commits are
        # already included upstream and might need a repository reset to recover."
        #
        # A merge commit keeps every Weblate commit reachable with its original hash, so the rebase
        # sees them as already upstream and drops them silently. Nothing else forces squash here:
        # the repo has allow_merge_commit enabled and the master ruleset carries no linear-history
        # rule, and human PRs are merge-committed too.
        run: |
          set -euo pipefail

          prs="$(gh pr list --repo "$REPO" --author weblate --state open --limit 10000 --json number,url)"
          rows="$(printf '%s\n' "$prs" | jq -r '.[] | [.number, .url] | @tsv')"
          failed=0
          while IFS=$'\t' read -r PR_NUMBER PR_URL; do
            [ -n "$PR_NUMBER" ] || continue
            if ! files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
              echo "::error::Could not read changed files for $PR_URL; refusing to auto-merge."
              echo "## ❌ Auto-merge blocked: could not read files for $PR_URL" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            if [ -z "$files" ]; then
              echo "::error title=Empty diff::Weblate PR $PR_URL reports no changed files; refusing to auto-merge."
              echo "## ❌ Auto-merge blocked: empty diff for $PR_URL" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            # Every changed path must be a .json file under client_v2/locales/<lang>/ (active) or
            # client/public/locales/<lang>/ (legacy, being wound down).
            offending="$(printf '%s\n' "$files" \
              | grep -vE '^(client_v2/locales|client/public/locales)/[^/]+/.+\.json$' || true)"

            if [ -n "$offending" ]; then
              echo "::error title=Out-of-scope Weblate PR::$PR_URL touches files outside the locale trees; not auto-merging."
              {
                echo "## ❌ Auto-merge blocked: out-of-scope changes"
                echo ""
                echo "Weblate PR: $PR_URL"
                echo ""
                echo "This Weblate PR changes files that are **not** locale JSON under"
                echo "\`client_v2/locales/\` or \`client/public/locales/\`:"
                echo ""
                echo '```'
                echo "$offending"
                echo '```'
                echo ""
                echo "Weblate sync PRs are only auto-merged when every changed file is a translation JSON"
                echo "file. This PR isn't, so it has been left for a maintainer to review and merge by hand."
              } >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            echo "$PR_URL: all $(printf '%s\n' "$files" | wc -l) changed file(s) are locale JSON. Safe to auto-merge."
            if merge_output="$(gh pr merge --repo "$REPO" --auto --merge "$PR_URL" 2>&1)"; then
              echo "$merge_output"
              continue
            fi

            echo "$merge_output"
            # GitHub can refuse auto-merge when the PR is already ready to merge.
            if [[ "$merge_output" == *"clean status"* || "$merge_output" == *"already mergeable"* ]]; then
              if gh pr merge --repo "$REPO" --merge "$PR_URL"; then
                continue
              fi
            fi

            echo "::error::Could not merge $PR_URL."
            echo "## ❌ Auto-merge blocked: merge failed for $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          done <<< "$rows"

          exit "$failed"
