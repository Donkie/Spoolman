version: '3.8'
services:
  spoolman:
    image: donkie/spoolman:test
    environment:
      - SPOOLMAN_LOGGING_LEVEL=INFO
      # The host guard refuses public domain names it was not told about; the security
      # tests need one that is allowed as well as one that is not.
      - SPOOLMAN_ALLOWED_HOSTS=spoolman.example.com
      - TZ=Europe/Stockholm
  tester:
    image: donkie/spoolman-tester:latest
    volumes:
      - ./tests:/tester/tests
    environment:
      - DB_TYPE=sqlite
    depends_on:
      - spoolman
