version: '3.8'
# Separate stack from docker-compose-sqlite.yml (and the other DB-type composes): this is
# the one deployment in CI with SPOOLMAN_TAG_AUTO_CREATE_ENABLED=TRUE, so the opt-in
# create-and-link path in POST /tag/scan has somewhere to actually run end-to-end. Every
# other compose file in this suite leaves it unset (off), which is the default a real
# deployment gets and is what tests_integration/tests/tag/test_scan_decode.py exercises.
# SQLite only: this is about the app-level opt-in gate, not DB-backend coverage.
services:
  spoolman:
    image: donkie/spoolman:test
    environment:
      - SPOOLMAN_LOGGING_LEVEL=INFO
      - SPOOLMAN_ALLOWED_HOSTS=spoolman.example.com
      - SPOOLMAN_TAG_AUTO_CREATE_ENABLED=TRUE
      - TZ=Europe/Stockholm
  tester:
    image: donkie/spoolman-tester:latest
    # Overrides the image's default `pytest tests` entrypoint and mount: this stack only
    # ever runs tests_tagcreate, not the regular tests/ suite -- tests/ assumes the
    # feature is off, and mounting it here too would run those tests against a server
    # they weren't written for.
    entrypoint: ["pytest", "--exitfirst", "tests_tagcreate"]
    volumes:
      - ./tests_tagcreate:/tester/tests_tagcreate
    environment:
      - DB_TYPE=sqlite
    depends_on:
      - spoolman
